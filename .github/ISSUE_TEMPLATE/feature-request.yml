name: Feature request
description: Suggest a capability CURB does not have yet.
title: "Feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        CURB has no backend, no accounts, and no network at runtime — every rule
        and polygon ships in the app so it works in the bottom of a parking
        structure. Ideas that need a server or a login are usually out of scope,
        but say it anyway; there is often an offline version of the same idea.

  - type: textarea
    id: problem
    attributes:
      label: What is the problem?
      description: Describe the parking situation you are stuck in, not the feature. That is what tells us the right fix.
      placeholder: I never know whether it is worth walking eight minutes further to save $4.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like the app to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead? (optional)
      description: Including "I check a different app" — knowing which one is useful.
    validations:
      required: false
