name: Test

# Pushes to main are the expected workflow in this repo (see CONTRIBUTING.md),
# so CI has to run on push as well as on pull requests. A PR-only trigger would
# gate nothing, because most changes never open a PR.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck / lint / test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs before the suite: version drift is silent, and the whole point of
      # scripts/version.mjs is that something checks it on every commit.
      - name: Check version locations are in sync
        run: node scripts/version.mjs check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (engine)
        run: npm test

      # Component tests run under jest-expo, which understands React Native's
      # platform-suffix resolution in a way Vitest does not. Uncomment when the
      # first ones land; see vitest.config.ts for why the runners are separate.
      # - name: Test (components)
      #   run: npm run test:components

  # Everything above runs on Linux and therefore never touches the iOS half of
  # this project. That gap is not theoretical: expo-modules-jsi shipped Swift
  # the Xcode 26 compiler rejects, and the app did not compile at all for a
  # while with the whole Linux suite green. Web builds either way, which is
  # exactly what makes it easy to miss.
  #
  # Push-to-main only. macOS runners are slow, and the failure this catches
  # comes from dependency updates rather than from day-to-day edits.
  ios-build:
    name: iOS builds
    if: github.event_name == 'push'
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # postinstall runs patch-package. If a patch stops applying because the
      # dependency moved, this fails here rather than at the compile step, and
      # the message names the patch.
      - name: Install dependencies
        run: npm ci

      - name: Generate the native project
        run: npx expo prebuild -p ios --no-install

      # The permission rule is a product decision, not a build detail: CURB asks
      # for location When In Use and nothing else. Checking the generated plist
      # is the only way to know, since a dependency can add keys back silently.
      - name: Check iOS asks for no permissions it does not use
        run: |
          PLIST=ios/CURB/Info.plist
          for key in NSLocationAlwaysUsageDescription \
                     NSLocationAlwaysAndWhenInUseUsageDescription \
                     NSMotionUsageDescription; do
            if /usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" >/dev/null 2>&1; then
              echo "::error::$PLIST declares $key, which CURB never requests."
              exit 1
            fi
          done
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" "$PLIST" \
            | grep -q 'PRODUCT_NAME' \
            && { echo "::error::When In Use string is still the Expo placeholder."; exit 1; }
          echo "Only NSLocationWhenInUseUsageDescription is declared, with a real purpose string."

      - name: Install pods
        run: npx pod-install

      # xcodebuild directly rather than `expo run:ios`, and a generic
      # destination rather than a named simulator: the point is that the code
      # compiles, and pinning "iPhone 17 Pro" would fail whenever the runner
      # image ships a different set of devices.
      - name: Build for the simulator
        run: |
          xcodebuild \
            -workspace ios/CURB.xcworkspace \
            -scheme CURB \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -quiet \
            build
